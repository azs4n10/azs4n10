name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: azs4n10
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff8fb1&color_dots=%23ebedf0,%23ffd6e5,%23ffb3cf,%23ff8fb1,%23ff5f9e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff8fb1&color_dots=%2316161b,%23502b3b,%238b3d5c,%23c9557a,%23ff8fb1

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
